version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Etc/GMT"
    labels:
      - "dependencies"
      - "github-actions"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Etc/GMT"
    labels:
      - "dependencies"
      - "composer"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Etc/GMT"
    labels:
      - "dependencies"
      - "docker"
